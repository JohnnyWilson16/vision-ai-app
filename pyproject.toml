[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-ai-app"
version = "0.1.0"
description = "End-to-End Vision AI Application powered by Florence-2 Vision-Language Model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Johnny Wilson Dougherty", email = "johnnydougherty09@gmail.com" }
]
keywords = [
    "vision-ai",
    "vlm",
    "florence-2",
    "computer-vision",
    "object-detection",
    "ocr",
    "image-captioning",
    "multimodal-ai"
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",
    "pillow>=9.0.0",
    "requests>=2.28.0",
    "accelerate>=0.28.0",
    "timm>=0.9.0",
    "einops>=0.7.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.30.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0"
]

[project.scripts]
vision-ai = "vision_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
